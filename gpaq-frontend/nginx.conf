server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ocultar versión de NGINX en las cabeceras
    server_tokens off;

    # Compresión para reducir el peso de la transferencia
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Reverse proxy hacia la API. /api/v1/... -> http://api:8000/api/v1/...
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Cache agresiva para assets con hash en el nombre (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker y manifiesto: evitar caché HTTP para garantizar actualizaciones inmediatas
    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida devuelve index.html (routing en cliente)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
